<style>
  /* Page-specific: outer page scroll = main editor scroll; left Photos list has its own scrollbar */
  html {
    scrollbar-width: thin;
    scrollbar-color: #7da2ff rgba(255,255,255,.06);
  }
  html::-webkit-scrollbar { width: 12px; height: 12px; }
  html::-webkit-scrollbar-track { background: rgba(255,255,255,.06); }
  html::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #7da2ff 0%, #a855f7 100%);
    border-radius: 10px;
    border: 2px solid #050814;
  }
  body.pdf-editor-page {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .editor-page-shell {
    width: min(1440px, 100% - 24px);
    margin: 0 auto;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    overflow: visible;
    padding: 18px 0 24px;
  }
  @media (max-width: 560px){
    .editor-page-shell{ width: min(1440px, 100% - 16px); padding: 12px 0 16px; }
  }
  .editor-backbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    flex: none;
  }
  .editor-backbar .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border-radius: 10px;
    border: 1px solid var(--editor-border);
    background: var(--panel);
    color: var(--text);
    font-size: 0.88rem;
    font-weight: 600;
    text-decoration: none;
    transition: background .15s, border-color .15s;
  }
  .editor-backbar .back-btn:hover { background: var(--panel-2); border-color: var(--editor-border-2); }
  .editor-backbar .back-title {
    font-family: var(--font-d);
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
  }
  .editor-backbar .back-sub {
    font-size: 0.82rem;
    color: var(--muted);
    margin-left: 4px;
  }
  #editorMount {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    overflow: visible;
  }
  /* Editor behaves like a page document — outer window scrolls main content */
  #editorMount .pe2,
  #editorMount .wope {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: visible;
    height: auto;
    min-height: 0;
  }
  #editorMount .wope-ribbon,
  #editorMount .wope-statusbar,
  #editorMount .wope-tip {
    flex: none;
  }
  #editorMount .wope-ribbon {
    position: sticky;
    top: 0;
    z-index: 20;
  }
  #editorMount .wope-work,
  #editorMount .pe2-work {
    flex: 1 1 auto;
    overflow: visible;
    height: auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 230px 1fr;
    gap: 14px;
    align-items: start;
    margin-top: 0;
  }
  /* Left Photos pane: sticky + independent scrollbar; main preview scrolls with page */
  #editorMount .pe2-left,
  #editorMount .wope-nav {
    position: sticky;
    top: 12px;
    align-self: start;
    max-height: calc(100dvh - 24px);
    height: calc(100dvh - 24px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  /* When ribbon is sticky, push left pane below it */
  #editorMount .wope-ribbon ~ .wope-work .pe2-left,
  #editorMount .wope-ribbon ~ .wope-work .wope-nav {
    top: 112px;
    max-height: calc(100dvh - 124px);
    height: calc(100dvh - 124px);
  }
  #editorMount .pe2-pages,
  #editorMount .wope-nav-pages {
    flex: 1 1 auto;
    min-height: 0;
    height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    scrollbar-gutter: stable;
    scrollbar-width: thin;
    scrollbar-color: #38bdf8 rgba(255,255,255,.06);
  }
  #editorMount .pe2-pages::-webkit-scrollbar,
  #editorMount .wope-nav-pages::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  #editorMount .pe2-pages::-webkit-scrollbar-track,
  #editorMount .wope-nav-pages::-webkit-scrollbar-track {
    background: rgba(255,255,255,.06);
    border-radius: 10px;
  }
  #editorMount .pe2-pages::-webkit-scrollbar-thumb,
  #editorMount .wope-nav-pages::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #38bdf8 0%, #f59e0b 100%);
    border-radius: 10px;
    border: 2px solid rgba(11,17,48,.9);
  }
  #editorMount .pe2-pages::-webkit-scrollbar-thumb:hover,
  #editorMount .wope-nav-pages::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, #60a5fa 0%, #fbbf24 100%);
  }
  /* Main preview: NO inner scrollbar — let window scroll handle it */
  #editorMount .pe2-main,
  #editorMount .wope-doc {
    overflow: visible;
    height: auto;
    min-height: 520px;
    align-self: stretch;
  }
  #editorMount .pe2-main::-webkit-scrollbar,
  #editorMount .wope-doc::-webkit-scrollbar { display: none; }
  /* Photo specific: larger preview */
  #editorMount .photo-canvas-wrap {
    background: #0e173c;
    border: 1px solid var(--editor-border);
    border-radius: 16px;
    padding: 18px;
    display: grid;
    place-items: center;
    min-height: 520px;
  }
  #editorMount .photo-canvas-wrap img,
  #editorMount .photo-canvas-wrap canvas {
    max-width: 100%;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    background: #fff;
  }
  /* Mobile: left becomes top horizontal strip, not sticky vertical */
  @media (max-width: 900px){
    #editorMount .wope-ribbon { position: static; }
    #editorMount .wope-work,
    #editorMount .pe2-work {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto;
    }
    #editorMount .pe2-left,
    #editorMount .wope-nav {
      position: static;
      top: auto;
      max-height: 220px;
      height: auto;
    }
    #editorMount .pe2-pages,
    #editorMount .wope-nav-pages {
      max-height: 180px;
      overflow-x: auto;
      overflow-y: hidden;
      flex-direction: row;
      scrollbar-gutter: auto;
      height: auto;
    }
    #editorMount .pe2-main,
    #editorMount .wope-doc {
      min-height: 360px;
    }
  }
</style>
</head>
<body class="pdf-editor-page">

<div class="bg-fx" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
</div>

<div class="editor-page-shell">
  <div class="editor-backbar">
    <a href="index.html#tools" class="back-btn" aria-label="Back to StudyVault">← Back to StudyVault</a>
    <span class="back-title">Photo Editor</span>
    <span class="back-sub">Offline • No uploads</span>
  </div>

  <div id="editorMount" aria-live="polite"></div>
</div>

<div class="toast-root" id="toastRoot" aria-live="polite"></div>

<noscript>
  <div class="noscript-message">StudyVault Photo Editor needs JavaScript. Please enable it and reload.</div>
</noscript>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const start = () => {
    const mount = document.getElementById('editorMount');
    if (!mount) return;
    if (typeof renderPhotoEditor !== 'function') {
      mount.innerHTML = '<div class="panel-err"><span>⚠️</span><div><b>Photo Editor failed to load</b><p>Please refresh. Check your connection once — afterwards it works offline.</p></div></div>';
      return;
    }
    const api = {
      onClose: (fn) => window.addEventListener('beforeunload', fn, {once:true}),
      reset: () => {
        mount.innerHTML = '';
        renderPhotoEditor(mount, api);
      }
    };
    renderPhotoEditor(mount, api);
  };
  if (document.readyState === 'complete') setTimeout(start, 400);
  else window.addEventListener('load', () => setTimeout(start, 400));
});
</script>
</body>
</html>
